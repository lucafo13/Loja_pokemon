<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento - WorldWeaver</title>

<link rel="shortcut icon" href="../img/logo.png">

<style>

    
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background-image: url(../img/fundo3.jpg);
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    background-attachment: fixed;
    margin: 0%;
    min-height: 100vh;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.card{
    background:rgb(146, 211, 255);
    width:100%;
    max-width:450px;
    padding:30px;
    border: 5px solid #000000;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:20px;
}

button{
    background-position: center;
    border: 3px solid #000000;
    cursor:pointer;
    padding:12px 20px;
    border-radius:8px;
    color:rgb(6, 6, 6);
    background:#6ffff3;
    margin-top:10px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
}

#pixArea,
#cartaoArea,
#producao{
    display:none;
}

.qrcode{
    width:250px;
    border-radius:10px;
}

footer{
    background:#0d867c;
    color:white;
    text-align:center;
    padding:25px;
}

.botaoFinal{
    display:inline-block;
    text-decoration:none;
    background:#0d867c;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    margin-top:20px;
}

</style>
</head>
<body>

<main>

<div class="card">

<div id="inicio">

<h2>Escolha a forma de pagamento</h2>

<button onclick="pix()">
Pagar com PIX
</button>

<button onclick="cartao()">
Pagar com Cartão
</button>

</div>

<div id="pixArea">

<h2>Pagamento via PIX</h2>

<p>Escaneie o QR Code abaixo:</p>

<br>

<img src="../img/qrcode_402991066_6f1d6a6e5be49aec7a67fde9c308f946.png" class="qrcode">

<p>
Aguardando pagamento...
</p>

</div>

<div id="cartaoArea">

<h2>Pagamento via Cartão</h2>

<input type="text" placeholder="Nome do titular">

<input type="text" placeholder="Número do cartão">

<input type="text" placeholder="Validade">

<input type="text" placeholder="CVV">

<button onclick="finalizarCartao()">
Finalizar
</button>

</div>

<div id="producao">

<h2>Estamos enviando seu pedido o seu codigo é: 594829374. Para mais informações envie uma mensagem no nosso intagram.</h2>

<p>
Nossa equipe já recebeu seu pedido.
</p>

<a href="../index.html" class="botaoFinal">
Comprar outro item
</a>

</div>

</div>

</main>

<script>

function pix(){

    document.getElementById("inicio").style.display="none";
    document.getElementById("pixArea").style.display="block";

    setTimeout(function(){

        document.getElementById("pixArea").style.display="none";
        document.getElementById("producao").style.display="block";

    },5000);

}

function cartao(){

    document.getElementById("inicio").style.display="none";
    document.getElementById("cartaoArea").style.display="block";

}

function finalizarCartao(){

    document.getElementById("cartaoArea").style.display="none";
    document.getElementById("producao").style.display="block";

}

</script>

</body>
</html>
